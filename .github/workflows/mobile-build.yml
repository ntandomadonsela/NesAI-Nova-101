name: Mobile build validation

on:
  push:
    branches:
      - "codex/mobile-app-release"
    paths:
      - ".github/workflows/mobile-build.yml"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mobile-build.yml"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.mobile.config.ts"

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug APK
    runs-on: ubuntu-24.04
    env:
      VITE_API_BASE_URL: ${{ vars.NESAI_API_BASE_URL || 'https://www.nesai.co.za' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://wqqxikusabchxywabmcx.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_fRya7XPT6jJmFVlSpX321w_05JJguw6' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Require public app configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Set the VITE_SUPABASE_URL Actions variable."; exit 1; }
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY as an Actions variable."
            exit 1
          fi

      - run: npm ci

      - run: npm run build:mobile

      - run: npx cap sync android

      - name: Install Android API 36
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_path" || { echo "Android SDK manager was not found."; exit 1; }
          set +o pipefail
          yes | "$sdkmanager_path" --licenses >/dev/null
          "$sdkmanager_path" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nesai-student-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator:
    name: iOS Simulator app
    runs-on: macos-26
    env:
      VITE_API_BASE_URL: ${{ vars.NESAI_API_BASE_URL || 'https://www.nesai.co.za' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://wqqxikusabchxywabmcx.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_fRya7XPT6jJmFVlSpX321w_05JJguw6' }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require public app configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Set the VITE_SUPABASE_URL Actions variable."; exit 1; }
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set VITE_SUPABASE_PUBLISHABLE_KEY or VITE_SUPABASE_ANON_KEY as an Actions variable."
            exit 1
          fi

      - run: npm ci

      - run: npm run build:mobile

      - run: npx cap sync ios

      - name: Build for iOS Simulator
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/nesai-ios-build"
          CODE_SIGNING_ALLOWED=NO
          build

      - uses: actions/upload-artifact@v4
        with:
          name: nesai-student-ios-simulator
          path: ${{ runner.temp }}/nesai-ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
